{% extends "global/base.html" %}

{% block content %}
    <div class='responsive-table'>
        <table class="contacts-table">
            <caption class="table-caption">
                Contacts
            </caption>
            <thead>
                <tr class="table-row table-row-header">
                    <th class="table-row-header">ID</th>
                    <th class="table-row-header">First Name</th>
                    <th class="table-row-header">Last Name</th>
                    <th class="table-row-header">Phone</th>
                    <th class="table-row-header">E-mail</th>
                </tr>
            </thead>
            <tbody>
                {% for Contact in contacts  %}
                    <tr class="table-row">
                        <td class="table-cel">
                            <a 
                            class="table-link" 
                            href="{% url "contact:contact" contact.id %}">
                                {{Contact.id}}
                            </a>
                        </td>
                        <td class="table-cel">
                            <a class="table-link" href="#">
                                {{Contact.fist_name}}
                            </a>
                        </td>
                        <td class="table-cel">
                            <a class="table-link" href="#">
                                {{Contact.last_name}}
                            </a>
                        </td>
                        <td class="table-cel">
                            <a class="table-link" href="#">
                                {{Contact.phone}}
                            </a>
                        </td>
                        <td class="table-cel">
                            <a class="table-link" href="#">
                                {{Contact.email}}
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock content %}
